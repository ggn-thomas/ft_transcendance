server {
	listen 443 ssl;
	# http2 on;
	server_name localhost;

	ssl_certificate /certs/certs.pem;
	ssl_certificate_key /certs/key.pem;
	root /usr/share/nginx/html;
	index index.html;

	# SPA fallback
	location / {
		try_files $uri $uri/ /index.html;
	}

	# Proxy vers backend auth (port 3000)
	location /api/auth {
		proxy_pass https://backend:3000;
		proxy_ssl_verify off;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		rewrite ^/api/auth/(.*)$ /$1 break;
	}

	# Proxy vers backend pong (port 8000)
	location /api/pong {
		proxy_pass https://backend:8000;
		proxy_ssl_verify off;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		rewrite ^/api/pong/(.*)$ /pong/$1 break;
	}

	# OAuth callback proxy
	location /oauth/callback {
		proxy_pass https://backend:3000/oauth/callback;
		proxy_ssl_verify off;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}

server {
	listen 80;
	server_name localhost;
	return 301 https://$host$request_uri;
}
